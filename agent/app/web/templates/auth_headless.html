<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if success %}Signed in{% else %}Sign-in did not work{% endif %} - rMirror</title>
    <style>
        :root {
            --terracotta: #c85a54;
            --charcoal: #2c2c2c;
            --sage: #9bb7a2;
            --cream: #f5f5dc;
            --muted: #6b6b6b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--cream);
            color: var(--charcoal);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 44px 36px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(44, 44, 44, 0.12);
            text-align: center;
        }

        .mark {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 28px;
        }

        .mark.ok { background: var(--sage); }
        .mark.fail { background: var(--terracotta); }

        h1 { font-size: 1.5em; margin-bottom: 12px; }

        p { color: var(--muted); font-size: 1.05em; line-height: 1.55; }

        a.app-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--terracotta);
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        {% if success %}
            <div class="mark ok">&#10003;</div>
            <h1>You're signed in.</h1>
            <p>You can close this tab and return to rMirror.</p>
            <a class="app-link" href="{{ app_url }}">Open rMirror</a>
        {% else %}
            <div class="mark fail">!</div>
            <h1>Sign-in did not work</h1>
            <p>{{ message }}</p>
        {% endif %}
    </div>

    {% if success %}
    <script>
        // Bring the rMirror app to the front. The link carries no data.
        window.location.href = "{{ app_url }}";
    </script>
    {% endif %}
</body>
</html>
