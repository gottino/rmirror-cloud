# Local-development helpers only.
#
# SQLite is the default local database (no setup needed, see README). Use this
# file only to test the backend against PostgreSQL and S3-compatible storage:
#
#   docker compose up -d
#   DATABASE_URL=postgresql://rmirror:rmirror_dev_password@localhost:5432/rmirror
#   S3_ENDPOINT_URL=http://localhost:9000  (create the bucket in the console, port 9001)
#
# The backend, dashboard and agent run on the host, not in containers.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rmirror
      POSTGRES_USER: rmirror
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmirror_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmirror -d rmirror"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"  # S3 API
      - "127.0.0.1:9001:9001"  # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
