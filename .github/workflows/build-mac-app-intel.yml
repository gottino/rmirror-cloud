name: Build Mac App 2.0 (Intel)

# rMirror for Mac 2.0 (agent/macos): universal Swift app + x86_64 Python core,
# signed, notarized and stapled by agent/macos/scripts/build_app.sh.
# Produces a workflow artifact only: no upload to B2, no release, no tag.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # CFBundleVersion is the commit count

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify architecture
        run: |
          echo "Python: $(python3 --version)"
          python3 -c "import platform; assert platform.machine() == 'x86_64', f'Expected x86_64, got {platform.machine()}'"
          swift --version

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        working-directory: agent
        run: poetry install --no-root

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Extract version
        id: version
        working-directory: agent
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/__version__.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Import signing certificate and notarization credentials
        env:
          CODESIGN_CERTIFICATE_P12: ${{ secrets.CODESIGN_CERTIFICATE_P12 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CODESIGN_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CODESIGN_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # build_app.sh uses a notarytool keychain profile; store one in the temporary keychain
          xcrun notarytool store-credentials rmirror-notarization \
            --apple-id "$NOTARIZE_APPLE_ID" \
            --team-id "$NOTARIZE_TEAM_ID" \
            --password "$NOTARIZE_PASSWORD" \
            --keychain "$KEYCHAIN_PATH" > /dev/null

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Found identity: $IDENTITY"
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build, sign, notarize
        working-directory: agent/macos
        env:
          NOTARY_PROFILE: rmirror-notarization
        run: NOTARY_KEYCHAIN="$KEYCHAIN_PATH" ./scripts/build_app.sh --arch x86_64

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rMirror-${{ steps.version.outputs.version }}-x86_64
          path: agent/macos/build/dist/rMirror-${{ steps.version.outputs.version }}-x86_64.dmg
          if-no-files-found: error

      - name: Build summary
        working-directory: agent/macos
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          DMG_PATH="build/dist/rMirror-${APP_VERSION}-x86_64.dmg"
          {
            echo "## Build Summary"
            echo ""
            echo "- **Version:** ${APP_VERSION}"
            echo "- **Core architecture:** x86_64 (Swift app: $(lipo -archs build/app/rMirror.app/Contents/MacOS/RMirrorApp))"
            echo "- **Size:** $(du -h "$DMG_PATH" | cut -f1)"
            echo "- **SHA256:** \`$(shasum -a 256 "$DMG_PATH" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
