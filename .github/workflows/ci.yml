name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: cd backend && poetry install --no-root

      - name: Lint
        run: cd backend && poetry run ruff check .

      # Unused dependencies and dead code. Config in backend/pyproject.toml,
      # kept-on-purpose names in backend/vulture_allowlist.py.
      - name: Dependency and dead-code checks (deptry, vulture)
        run: |
          cd backend
          poetry run pip install deptry==0.25.1 vulture==2.16
          poetry run deptry app alembic
          poetry run vulture

      - name: Unit tests
        run: |
          cd backend
          export SECRET_KEY=test-secret-key
          export DATABASE_URL=sqlite:///:memory:
          poetry run pytest tests/ -v --tb=short -x

  # Unit tests build their SQLite schema from the models. This job builds the
  # schema the way production does (alembic on PostgreSQL) and fails if the
  # models and the migrated schema disagree.
  backend-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rmirror
          POSTGRES_PASSWORD: rmirror
          POSTGRES_DB: rmirror
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rmirror"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: test-secret-key
      DATABASE_URL: postgresql://rmirror:rmirror@localhost:5432/rmirror
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: cd backend && poetry install --no-root

      - name: Single migration head
        run: |
          cd backend
          test "$(poetry run alembic heads | wc -l)" -eq 1

      - name: Upgrade empty database to head
        run: cd backend && poetry run alembic upgrade head

      - name: Models match migrated schema
        run: cd backend && poetry run alembic check

      - name: Downgrade one step and upgrade again
        run: |
          cd backend
          poetry run alembic downgrade -1
          poetry run alembic upgrade head
          poetry run alembic check

      - name: Concurrency tests on PostgreSQL
        run: |
          cd backend
          TEST_POSTGRES_URL="$DATABASE_URL" poetry run pytest tests/unit/test_concurrent_upserts_postgres.py tests/unit/test_metadata_sync_postgres.py tests/unit/test_notebook_metadata_record_postgres.py -v

  dashboard-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd dashboard && npm ci

      - name: Lint
        run: cd dashboard && npm run lint

      - name: Unit tests
        run: cd dashboard && npm test

      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: https://rmirror.io
          NEXT_PUBLIC_UMAMI_URL: ${{ secrets.NEXT_PUBLIC_UMAMI_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
        run: cd dashboard && npm run build

  agent-checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: cd agent && poetry install --no-root

      - name: Lint
        run: cd agent && poetry run ruff check .

      - name: Unit tests
        run: cd agent && poetry run pytest tests/ -v --tb=short -x
